name: Build Yanz Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "Yanz-Android-Ready.zip"
      - ".github/workflows/build-yanz-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Android project
        run: |
          unzip -o Yanz-Android-Ready.zip -d .
          test -f Yanz-Android-Ready/app/build.gradle.kts

      - name: Build debug APK
        working-directory: Yanz-Android-Ready
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yanz-debug-apk
          path: Yanz-Android-Ready/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
